name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          cmake --version
          c++ --version
          clang-format --version || true
      # Same gate as a local milestone commit, on the supported platform (ADR-004):
      # fast suite, exhaustive recovery sweep, then Release. Under main-first (ADR-005)
      # this runs after the commit, as the independent clean-environment check.
      - name: Verify project
        run: ./scripts/verify-full.sh
